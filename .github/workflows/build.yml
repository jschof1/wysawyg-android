name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK r27c
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache pinned model archive and assets
        uses: actions/cache@v5
        with:
          path: .phonon
          key: phonon-1c91a6a7-48137a58011c4b0b-v1

      - name: Prepare and verify bundled model
        run: python3 scripts/prepare-phonon-model.py --download --model-dir .phonon/c_weights --archive .phonon/phonon-2-c-weights-v1.tar.gz

      - name: Build native engine, tests and APKs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          python3 scripts/test-phonon-model.py
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: wysawyg-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
